# ---------- Font ----------
[font]
size = 16.0
normal      = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold        = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic      = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

# ---------- macOS tweaks ----------
[keyboard]
bindings = []

[env]
TERM = "xterm-256color"
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"

# ---------- Scrolling ----------
[scrolling]
history = 10000
multiplier = 3

# ---------- Window ----------
[window]
padding = { x = 6, y = 6 }
dynamic_padding = true
opacity = 0.95
decorations = "Full"
title = "Alacritty"
option_as_alt = "Both"

# ---------- Cursor ----------
[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = false

# ---------- Mouse ----------
[mouse]
hide_when_typing = true

# ---------- Colors (Catppuccin Mocha) ----------
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.footer_bar]
background = "#181825"
foreground = "#cdd6f4"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"
