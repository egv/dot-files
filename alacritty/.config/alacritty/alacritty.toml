# ---------- Theme import (Tokyonight) ----------
# Pick ONE import (uncomment exactly one). Night is active by default.
general.import = [
  "~/.config/alacritty/themes/tokyonight-night.toml",
  # "~/.config/alacritty/themes/tokyonight-storm.toml",
  # "~/.config/alacritty/themes/tokyonight-moon.toml",
  # "~/.config/alacritty/themes/tokyonight-day.toml",
]

# ---------- Font ----------
[font]
size = 14.0
normal      = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold        = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic      = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

# If icons still render as boxes, try one of these exact names instead:
# normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
# normal = { family = "JetBrains Mono Nerd Font",     style = "Regular" }

# ---------- Launch zellij on startup ----------
#[shell]
#program = "/opt/homebrew/bin/zellij"
#args = []

# ---------- macOS tweaks ----------
[keyboard]
bindings = []

[env]
TERM = "xterm-256color"
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"

# ---------- Scrolling ----------
[scrolling]
history = 10000
multiplier = 3

# ---------- Window ----------
[window]
padding = { x = 6, y = 6 }
dynamic_padding = true
opacity = 1.0
decorations = "Full"
title = "Alacritty"
option_as_alt = "Both"

# ---------- Cursor ----------
[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = false

# ---------- Mouse ----------
[mouse]
hide_when_typing = true
